name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Compact contract
        working-directory: contract
        run: npm run compact

      - name: Typecheck contract
        working-directory: contract
        run: npm run typecheck

      - name: Lint contract
        working-directory: contract
        run: npm run lint

      - name: Build contract
        working-directory: contract
        run: npm run build

      - name: Run contract tests (20 tests)
        working-directory: contract
        run: npx vitest run --reporter=verbose

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Build CLI
        working-directory: confidential-voting-cli
        run: npm run build

      - name: Typecheck UI
        working-directory: confidential-voting-ui
        run: npm run typecheck
