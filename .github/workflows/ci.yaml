name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Compile Compact contract + run unit tests
  # ─────────────────────────────────────────────────────────────────────────
  contract:
    name: Compile & Test Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Compact contract
        working-directory: contract
        run: npm run compact

      - name: Typecheck contract
        working-directory: contract
        run: npm run typecheck

      - name: Lint contract
        working-directory: contract
        run: npm run lint

      - name: Build contract
        working-directory: contract
        run: npm run build

      - name: Run contract tests
        working-directory: contract
        run: npx vitest run --reporter=verbose

      - name: Upload managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-managed
          path: contract/src/managed/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build API layer
  # ─────────────────────────────────────────────────────────────────────────
  api:
    name: Build API
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-managed
          path: contract/src/managed/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build API
        working-directory: api
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Typecheck + build the frontend
  # ─────────────────────────────────────────────────────────────────────────
  ui:
    name: Typecheck & Build UI
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-managed
          path: contract/src/managed/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build API (UI depends on it)
        working-directory: api
        run: npm run build

      - name: Typecheck UI
        working-directory: confidential-voting-ui
        run: npm run typecheck

      - name: Build UI (production, preprod mode)
        working-directory: confidential-voting-ui
        run: |
          rm -rf ./dist
          npx vite build --mode preprod

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Build CLI
  # ─────────────────────────────────────────────────────────────────────────
  cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-managed
          path: contract/src/managed/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build API (CLI depends on it)
        working-directory: api
        run: npm run build

      - name: Build CLI
        working-directory: confidential-voting-cli
        run: npm run build
